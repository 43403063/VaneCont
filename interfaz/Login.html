<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <div class="container">
    <h1>Iniciar Sesión</h1>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Correo electrónico" required />
      <input type="password" id="password" placeholder="Contraseña" required />
      <button class="btn-info" type="submit">Ingresar</button>
    </form>

    <!-- Contenedor para mostrar errores -->
    <div id="errorContainer" class="error-container" style="display: none;">
      <ul id="errorList"></ul>
    </div>
    <a href="Index.html" class="btn-back">Volver a Inicio</a>
  </div>

  <!-- Scripts de clases -->
  <script src="js/LocalStorage.js"></script>
  <script src="js/ApiBase.js"></script>
  <script src="js/Modelos/Usuario.js"></script>
  <script src="js/LoginManager.js"></script>

</body>

</html>
